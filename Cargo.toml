[package]
name = "onair-bot"
version = "0.2.0"
edition = "2021"
description = "Turn on an on-air light via SwitchBot when the camera is in use."
license = "MIT"
repository = "https://github.com/yoshiori/onair-bot"

[[bin]]
name = "onair-bot"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
